<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveTV - Sports Stream App</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
    }
  </style>
</head>
<body class="p-6">

  <header class="flex justify-between items-center mb-8 border-b border-zinc-800 pb-4">
    <div class="flex items-center gap-3">
      <h1 class="text-2xl font-bold tracking-wider text-white">LiveTV <span class="text-xs bg-zinc-800 px-2 py-0.5 rounded text-zinc-400">v2.0</span></h1>
    </div>
    
    <div class="flex items-center gap-2 px-3 py-1.5 bg-green-500/10 border border-green-500/20 rounded-md text-xs font-semibold text-green-400">
      <span class="relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
      </span>
      <span id="visitor-count">142</span> watching now
    </div>
  </header>

  <main id="channel-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
    </main>

  <script>
    // ১. আপনার চ্যানেলের ডাটাবেজ (JSON Array format)
    // এখানে flagcdn এর জন্য countryCode এবং লোগোর জন্য bgThemeColor সেট করা আছে
    const channels = [
      { id: "tyc-latino", name: "TYC Latino", shortName: "TY", category: "Latino", resolution: "LIVE", countryCode: "AR", country: "Argentina", bgThemeColor: "#65a30d", isActive: true },
      { id: "dsports-1", name: "DSPORTS 1", shortName: "D1", category: "Sports", resolution: "LIVE", countryCode: "AR", country: "Argentina", bgThemeColor: "#16a34a", isActive: true },
      { id: "dsports-main", name: "DSports", shortName: "DS", category: "Sports", resolution: "LIVE", countryCode: "ES", country: "Spain", bgThemeColor: "#0d9488", isActive: true },
      { id: "espn-premium", name: "ESPN Premium", shortName: "EP", category: "ESPN", resolution: "LIVE", countryCode: "US", country: "United States", bgThemeColor: "#ea580c", isActive: false },
      { id: "tnt-sport", name: "TNT Sport", shortName: "TS", category: "Sports", resolution: "LIVE", countryCode: "CL", country: "Chile", bgThemeColor: "#2563eb", isActive: true },
      { id: "win-sports", name: "WIN Sports", shortName: "WI", category: "Live Sports", resolution: "LIVE", countryCode: "CO", country: "Colombia", bgThemeColor: "#dc2626", isActive: true },
      { id: "dazn-f1", name: "DAZN F1", shortName: "DF", category: "DAZN", resolution: "LIVE", countryCode: "GB", country: "United Kingdom", bgThemeColor: "#4f46e5", isActive: false },
      { id: "eurosport-1", name: "Eurosport 1", shortName: "E1", category: "Sports", resolution: "LIVE", countryCode: "FR", country: "France", bgThemeColor: "#0284c7", isActive: true }
    ];

    // LocalStorage থেকে আগের ফেভারিট লিস্ট লোড করা
    let favorites = JSON.parse(localStorage.getItem('tv_favorites')) || [];

    // ২. ফেভারিট অন/অফ করার ফাংশন
    function toggleFavorite(id) {
      if (favorites.includes(id)) {
        favorites = favorites.filter(favId => favId !== id);
      } else {
        favorites.push(id);
      }
      localStorage.setItem('tv_favorites', JSON.stringify(favorites));
      renderChannels(); // লিস্ট রি-ফ্রেশ করে ফেভারিটগুলোকে টপে নিয়ে আসবে
    }

    // ৩. গ্রিডের ভেতর কার্ড জেনারেট করার মেইন ফাংশন
    function renderChannels() {
      const grid = document.getElementById('channel-grid');
      grid.innerHTML = ''; // আগের ডাটা ক্লিয়ার করা

      // সর্টিং: ফেভারিট চ্যানেলগুলো আগে আসবে, ইনঅ্যাক্টিভগুলো শেষে যাবে
      const sortedChannels = [...channels].sort((a, b) => {
        const aFav = favorites.includes(a.id) ? 1 : 0;
        const bFav = favorites.includes(b.id) ? 1 : 0;
        if (bFav !== aFav) return bFav - aFav;
        return b.isActive - a.isActive; 
      });

      sortedChannels.forEach(channel => {
        const isFav = favorites.includes(channel.id);
        
        const card = document.createElement('div');
        // ইনঅ্যাক্টিভ হলে কার্ড একটু অপাসিটি কম দেখাবে
        card.className = `relative p-4 rounded-xl transition-all duration-300 border ${
          channel.isActive ? 'border-zinc-800 bg-zinc-900/50 hover:border-zinc-700' : 'border-red-950/30 bg-zinc-950/40 opacity-50'
        }`;

        card.innerHTML = `
          <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-2">
              <img 
                src="https://flagcdn.com/24x18/${channel.countryCode.toLowerCase()}.png" 
                alt="${channel.country}" 
                class="rounded-sm shadow-sm"
              >
              <span class="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">${channel.countryCode}</span>
            </div>
            
            <button onclick="toggleFavorite('${channel.id}')" class="text-zinc-500 hover:text-yellow-500 transition-colors">
              <i class="${isFav ? 'fa-solid fa-star text-yellow-500' : 'fa-regular fa-star'} text-sm"></i>
            </button>
          </div>

          <div class="flex items-center gap-3 my-3">
            <div 
              class="w-10 h-10 rounded-lg flex items-center justify-center font-bold text-white text-sm shadow-md"
              style="background-color: ${channel.bgThemeColor};"
            >
              ${channel.shortName}
            </div>
            <div class="flex-1 min-w-0">
              <h4 class="text-sm font-semibold text-zinc-100 truncate">${channel.name}</h4>
              <p class="text-xs text-zinc-500">${channel.category} • ${channel.resolution}</p>
            </div>
          </div>

          <div class="mt-4 flex justify-between items-center pt-2 border-t border-zinc-800/60">
            <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium ${
              channel.isActive ? 'bg-green-500/10 text-green-400' : 'bg-red-500/10 text-red-400'
            }">
              <span class="w-1.5 h-1.5 rounded-full ${channel.isActive ? 'bg-green-500 animate-pulse' : 'bg-red-500'}"></span>
              ${channel.isActive ? 'Active' : 'Inactive'}
            </span>

            <button class="p-1.5 bg-zinc-800 hover:bg-green-600 rounded-full text-zinc-400 hover:text-white transition-colors">
              <i class="fa-solid fa-play text-[10px] pl-0.5"></i>
            </button>
          </div>
        `;
        
        grid.appendChild(card);
      });
    }

    // ৪. ডাইনামিক রিয়েল-টাইম ভিজিটর কাউন্টার লজিক
    function startVisitorCounter() {
      const counterEl = document.getElementById('visitor-count');
      setInterval(() => {
        let currentCount = parseInt(counterEl.innerText);
        // র‍্যান্ডমলি ২/৩ জন কমবে বা বাড়বে রিয়েল লুক দেওয়ার জন্য
        const change = Math.floor(Math.random() * 5) - 2; 
        let newCount = currentCount + change;
        if(newCount < 50) newCount = 55; // সর্বনিম্ন লিমিট
        counterEl.innerText = newCount;
      }, 3500); // প্রতি ৩.৫ সেকেন্ড পর পর আপডেট হবে
    }

    // অ্যাপ লোড হওয়ার পর রান হবে
    window.onload = () => {
      renderChannels();
      startVisitorCounter();
    };
  </script>
</body>
</html>
