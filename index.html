<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveTV Web Application</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* কাস্টম স্ক্রোলবার এবং ডার্ক থিম স্মুথনেস */
    body {
      background-color: #0d0e12;
      color: white;
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1f232b;
      border-radius: 10px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans select-none">

  <header class="flex justify-between items-center px-6 py-4 bg-[#13151a] border-b border-[#1f232b]">
    <div class="flex items-center space-x-2">
      <i data-lucide="radio" class="w-6 h-6 text-[#39FF14] animate-pulse"></i>
      <span class="text-xl font-bold tracking-wide">LiveTV</span>
    </div>
    
    <div class="flex items-center space-x-4 text-sm text-gray-400">
      <div class="flex items-center space-x-1 bg-[#1a1d24] px-3 py-1.5 rounded-md">
        <i data-lucide="clock" class="w-4 h-4 text-gray-400"></i>
        <span id="live-time" class="font-mono text-white">00:00:00 PM</span>
      </div>
      <span class="bg-[#1a1d24] text-[#39FF14] px-3 py-1.5 rounded-md font-medium border border-[#39FF14]/20">
        223 channels
      </span>
    </div>
  </header>

  <main class="flex-1 grid grid-cols-12 gap-4 p-4 overflow-hidden">
    
    <section class="col-span-9 flex flex-col space-y-2">
      <div class="flex items-center space-x-3 bg-[#13151a] p-3 rounded-t-lg border-t border-x border-[#1f232b]">
        <span class="bg-red-600 text-white text-xs font-bold px-2 py-0.5 rounded flex items-center gap-1">
          <span class="w-1.5 h-1.5 bg-white rounded-full animate-ping"></span> LIVE NOW
        </span>
        <h1 id="player-channel-name" class="text-lg font-bold text-white">ESPN LAT</h1>
        <span class="text-xs text-gray-400">Channel 003</span>
        <span id="player-channel-quality" class="text-xs bg-[#1a1d24] px-2 py-0.5 rounded text-gray-300 border border-gray-700">720P</span>
      </div>

      <div class="relative flex-1 bg-black rounded-b-lg overflow-hidden group border-b border-x border-[#1f232b] flex items-center justify-center">
        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-black/30 z-10"></div>
        
        <div class="text-center z-0 text-gray-600">
          <p class="text-xl font-semibold mb-2">Streaming Stream...</p>
          <p id="player-channel-url" class="text-xs font-mono text-gray-500">https://demo.unified-streaming.com/.../tears-of-steel.m3u8</p>
        </div>

        <div class="absolute inset-0 flex items-center justify-center space-x-8 opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-20 bg-black/40">
          <button class="p-3 bg-black/60 hover:bg-[#39FF14] rounded-full text-white hover:text-black transition">
            <i data-lucide="rotate-ccw" class="w-6 h-6"></i>
          </button>
          <button id="play-pause-btn" class="p-5 bg-black/60 hover:bg-[#39FF14] rounded-full text-white hover:text-black transition transform scale-110">
            <i data-lucide="pause" class="w-8 h-8"></i>
          </button>
          <button class="p-3 bg-black/60 hover:bg-[#39FF14] rounded-full text-white hover:text-black transition">
            <i data-lucide="rotate-cw" class="w-6 h-6"></i>
          </button>
        </div>

        <div class="absolute bottom-0 inset-x-0 p-4 flex justify-between items-center z-20 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
          <div class="flex items-center space-x-4">
            <i data-lucide="volume-2" class="w-5 h-5 text-white hover:text-[#39FF14] cursor-pointer"></i>
            <div class="w-24 h-1 bg-gray-600 rounded-full overflow-hidden">
              <div class="w-3/4 h-full bg-[#39FF14]"></div>
            </div>
          </div>
          <div class="flex items-center space-x-4">
            <i data-lucide="settings" class="w-5 h-5 text-white hover:text-[#39FF14] cursor-pointer"></i>
            <i data-lucide="maximize" class="w-5 h-5 text-white hover:text-[#39FF14] cursor-pointer"></i>
          </div>
        </div>
      </div>
    </section>

    <section class="col-span-3 bg-[#13151a] rounded-lg border border-[#1f232b] p-5 flex flex-col space-y-6">
      <div id="card-logo-text" class="w-24 h-24 bg-[#22ff22]/20 border border-[#39FF14] rounded-xl flex items-center justify-center text-[#39FF14] text-3xl font-black shadow-[0_0_15px_rgba(57,255,20,0.2)]">
        EL
      </div>

      <div>
        <p class="text-xs text-[#39FF14] font-bold tracking-widest uppercase">🔵 Signal Source</p>
        <h2 id="card-channel-name" class="text-2xl font-black mt-1 text-white tracking-wide">ESPN LAT</h2>
      </div>

      <div class="flex-1 space-y-4 border-t border-[#1f232b] pt-4 text-sm">
        <div class="flex flex-col">
          <span class="text-gray-500 text-xs font-semibold uppercase">Group</span>
          <span id="card-group" class="text-gray-200 font-medium mt-0.5">ESPN</span>
        </div>
        <div class="flex flex-col">
          <span class="text-gray-500 text-xs font-semibold uppercase">Region</span>
          <span id="card-region" class="text-gray-200 font-medium mt-0.5">Global</span>
        </div>
        <div class="flex flex-col">
          <span class="text-gray-500 text-xs font-semibold uppercase">Host</span>
          <span id="card-host" class="text-mono text-gray-300 font-medium mt-0.5">181.191.141.7</span>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-[#13151a] border-t border-[#1f232b] p-4 flex flex-col space-y-3">
    <div id="category-container" class="flex items-center space-x-3 overflow-x-auto pb-1 custom-scrollbar">
      </div>

    <div class="flex justify-end space-x-3 pt-1 border-t border-[#1f232b]/50">
      <button class="flex items-center space-x-1.5 bg-[#1a1d24] hover:bg-[#232833] text-gray-300 px-4 py-2 rounded text-xs font-semibold border border-[#2d333f] transition">
        <i data-lucide="compass" class="w-3.5 h-3.5"></i>
        <span>Browse</span>
      </button>
      <button class="flex items-center space-x-1.5 bg-[#1a1d24] hover:bg-[#232833] text-gray-300 px-4 py-2 rounded text-xs font-semibold border border-[#2d333f] transition">
        <i data-lucide="grid" class="w-3.5 h-3.5"></i>
        <span>Guide</span>
      </button>
    </div>
  </footer>

  <script>
    // ডামি ডাটা সেট
    const channels = [
      { id: '1', name: 'ESPN LAT', group: 'Sports', region: 'Global', host: '181.191.141.7', url: 'https://demo.m3u8/espn', quality: '720P', logoText: 'EL' },
      { id: '2', name: 'DAZN 1 Main', group: 'DAZN', region: 'Europe', host: '192.168.1.50', url: 'https://demo.m3u8/dazn', quality: '1080P', logoText: 'DZ' },
      { id: '3', name: 'Fox Sports 1', group: 'Sports', region: 'USA', host: '45.12.32.10', url: 'https://demo.m3u8/fox', quality: '720P', logoText: 'FS' }
    ];

    const categories = [
      { name: 'Favorites', count: 8 },
      { name: 'Sports', count: 61 },
      { name: 'Latino', count: 30 },
      { name: 'Live Sports', count: 25 },
      { name: 'DAZN', count: 12 },
      { name: 'USA', count: 54 }
    ];

    let activeCategory = 'Sports';

    // ১. রিয়েল টাইম ঘড়ি আপডেট
    function updateClock() {
      const now = new Date();
      document.getElementById('live-time').innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ২. ক্যাটাগরি বাটন রেন্ডার করা
    const categoryContainer = document.getElementById('category-container');
    categories.forEach(cat => {
      const button = document.createElement('button');
      button.className = `px-4 py-2 rounded-md font-medium text-xs whitespace-nowrap transition-all duration-200 ${
        activeCategory === cat.name
          ? 'bg-[#39FF14] text-black font-bold shadow-[0_0_10px_rgba(57,255,20,0.3)]'
          : 'bg-[#1a1d24] text-gray-400 hover:bg-[#232833] hover:text-white'
      }`;
      button.innerHTML = `${cat.name} <span class="ml-1 text-[10px] ${activeCategory === cat.name ? 'text-black/70' : 'text-gray-500'}">${cat.count}</span>`;
      categoryContainer.appendChild(button);
    });

    // ৩. প্লে/পজ বাটনের কাস্টম অ্যাকশন
    let isPlaying = true;
    const playPauseBtn = document.getElementById('play-pause-btn');
    playPauseBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playPauseBtn.innerHTML = isPlaying ? '<i data-lucide="pause" class="w-8 h-8"></i>' : '<i data-lucide="play" class="w-8 h-8"></i>';
      lucide.createIcons(); // আইকন রিলোড করার জন্য
    });

    // Lucide Icons ইনিশিয়ালাইজ করা
    lucide.createIcons();
  </script>
</body>
</html>
