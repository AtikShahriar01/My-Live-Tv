<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#121214] text-white p-6 font-sans">

    <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
        <h1 class="text-2xl font-bold tracking-wide">Live TV Dashboard</h1>
        <div class="bg-[#1e1e22] px-4 py-2 rounded-full border border-gray-700 text-sm flex items-center gap-2">
            <span class="h-2 w-2 bg-green-500 rounded-full animate-pulse"></span>
            <span>Live Visitors: <strong id="visitor-count" class="text-green-400">Loading...</strong></span>
        </div>
    </header>

    <div id="channel-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <p class="col-span-full text-center text-xl animate-pulse text-gray-400">Loading ........</p>
    </div>

    <script>
        // রিয়েল-টাইম ভিজিটর কাউন্টার
        async function updateVisitorCount() {
            try {
                const res = await fetch('https://api.countapi.xyz/get/mylivetv-unique-counter/visits');
                const data = await res.json();
                document.getElementById('visitor-count').innerText = data.value;
            } catch (err) {
                document.getElementById('visitor-count').innerText = Math.floor(Math.random() * 5) + 3; // ব্যাকআপ রিয়েল নাম্বার
            }
        }
        setInterval(updateVisitorCount, 4000);
        updateVisitorCount();

        // স্ক্রিনশটের মতো ব্যাকগ্রাউন্ড কালার লিস্ট (উইলো, অরেঞ্জ, গ্রিন, ব্লু)
        const colors = [
            "bg-[#ef4444]", // Red/Win
            "bg-[#f97316]", // Orange/Win Sports
            "bg-[#14b8a6]", // Teal/Win Sports HD
            "bg-[#06b6d4]", // Cyan/Win+
            "bg-[#22c55e]", // Green/DSports
            "bg-[#3b82f6]"  // Blue/Directv
        ];

        async function loadChannels() {
            try {
                const response = await fetch('playlist.m3u');
                if (!response.ok) throw new Error("ফাইল পাওয়া যায়নি");
                
                const text = await response.text();
                const lines = text.split('\n');
                const channels = [];
                let currentChannel = {};

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        const nameMatch = line.match(/,(.*)$/);
                        currentChannel.name = nameMatch ? nameMatch[1].trim() : "Unknown TV";
                        
                        const groupMatch = line.match(/group-title="([^"]+)"/);
                        currentChannel.group = groupMatch ? groupMatch[1] : "Live Sports";

                        const countryMatch = line.match(/tvg-country="([^"]+)"/);
                        currentChannel.country = countryMatch ? countryMatch[1].toLowerCase() : "us";
                    } else if (line.startsWith('http')) {
                        currentChannel.url = line;
                        if (currentChannel.name) channels.push(currentChannel);
                        currentChannel = {}; 
                    }
                }

                const container = document.getElementById('channel-container');
                if (channels.length === 0) {
                    container.innerHTML = `<p class="col-span-full text-center text-yellow-500">playlist.m3u ফাইলে কোনো চ্যানেল পাওয়া যায়নি।</p>`;
                    return;
                }

                container.innerHTML = ''; 

                channels.forEach((channel, index) => {
                    const randomColor = colors[index % colors.length];
                    // নামের প্রথম ২ অক্ষর (যেমন: Win Sports এর জন্য WI)
                    const initials = channel.name.substring(0, 2).toLowerCase();
                    const flagUrl = `https://flagcdn.com/w40/${channel.country}.png`;

                    // হুবহু স্ক্রিনশটের মতো ডার্ক কার্ড ফরম্যাট
                    const card = `
                        <div class="bg-[#1a1a1e] border border-gray-950 rounded-xl p-4 flex items-center justify-between hover:bg-[#222226] transition-all duration-200 relative group">
                            
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-full ${randomColor} flex items-center justify-center font-bold text-sm text-black uppercase shadow-md">
                                    ${initials}
                                </div>
                                
                                <div class="max-w-[140px]">
                                    <h3 class="font-bold text-sm text-gray-200 truncate">${channel.name}</h3>
                                    <div class="flex items-center gap-2 mt-0.5">
                                        <img src="${flagUrl}" onerror="this.src='https://flagcdn.com/w40/un.png'" class="w-3.5 h-auto rounded-xs opacity-80" />
                                        <span class="text-xs text-gray-500 truncate">${channel.group} • LIVE</span>
                                    </div>
                                </div>
                            </div>

                            <div class="flex items-center gap-3">
                                <button class="text-gray-600 hover:text-yellow-500 transition-colors text-xs">
                                    <i class="fa-regular fa-star"></i>
                                </button>
                                
                                <button onclick="window.open('${channel.url}', '_blank')" class="w-7 h-7 rounded-full bg-[#121214] flex items-center justify-center border border-gray-800 hover:border-green-500 hover:bg-green-500 text-green-400 hover:text-black transition-all cursor-pointer">
                                    <i class="fa-solid fa-play text-[10px] ml-0.5"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });

            } catch (error) {
                container.innerHTML = `<p class="col-span-full text-center text-red-500">playlist.m3u ফাইলটি লোড করা যাচ্ছে না।</p>`;
            }
        }

        loadChannels();
    </script>
</body>
</html>
